name: Backend security boundaries
on:
  pull_request:
    paths:
      - 'apps/web/server/**'
      - 'apps/web/app/api/**'
      - 'apps/web/features/auth/**'
      - 'apps/worker/**'
      - 'supabase/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/backend-security.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/server/**'
      - 'apps/web/app/api/**'
      - 'apps/web/features/auth/**'
      - 'apps/worker/**'
      - 'supabase/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/backend-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run typecheck --workspace @byus/worker
      - name: API authorization, disclosure and outbound URL regression tests
        run: >-
          npm run test --workspace @byus/web -- --maxWorkers=3
          features/auth server/auth server/fan-auth
          features/community-stamps server/community-stamps
          server/notice/notice-admin-security.test.ts server/notification
          server/fan-posts server/content-translation server/schedules
          server/profile/account-deletion.test.ts server/my/fan-history-route.test.ts
          server/onchain app/api/public/onchain
      - run: npm run test --workspace @byus/worker
      - run: npm run build --workspace @byus/worker
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Replay migrations and exercise real role and concurrent quota boundaries
        run: npm run security:backend-db
      - name: Verify creator raffle eligibility and ownership concurrency
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          BYUS_CLEAN_DB_PORT=55486 \
          BYUS_CLEAN_DB_ASSERTION_FILE=supabase/tests/creator_raffle_campaigns.sql \
          BYUS_CLEAN_DB_SHELL_ASSERTION_FILE=supabase/tests/creator_raffle_campaigns_concurrency.sh \
          bash scripts/verify-clean-migration-chain.sh
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge test --root contracts
      - name: Verify immediate-registration deployment plan guards
        run: node --test scripts/prepare-action-hub-cutover.test.mjs scripts/register-giwa-campaign.test.mjs
      - name: Exercise worker to ActionHub on local Anvil
        run: RUN_ACTION_ANVIL_INTEGRATION=1 npm run test --workspace @byus/worker -- test/action-anvil.integration.test.ts
      - name: Validate ActionHub namespace upgrade compatibility
        working-directory: contracts
        run: bash scripts/verify-storage.sh
