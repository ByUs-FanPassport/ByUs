<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>ByUs — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #fff; color: #121212; font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(100%, 440px); }
    img { width: 88px; height: auto; }
    h1 { margin: 32px 0 12px; font-size: 24px; line-height: 1.4; }
    p { margin: 8px 0; color: #5d5d5d; overflow-wrap: anywhere; }
    a { display: inline-flex; min-height: 48px; align-items: center; margin-top: 24px; padding: 8px 20px; border-radius: 12px; background: #121212; color: #fff; text-decoration: none; }
    a:focus-visible { outline: 3px solid #121212; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/images/guest-home/byus-wordmark.svg" alt="ByUs" width="88" height="32">
    <h1>최신 상태를 불러오지 못했어요.</h1>
    <p>연결을 확인하고 다시 불러와 주세요.</p>
    <p lang="en">We couldn't load the latest version. Check your connection and try again.</p>
    <a href="">다시 시도 / <span lang="en">Try again</span></a>
  </main>
</body>
</html>
